services:
  escriba:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - app_env
        - app_env_local
    container_name: escriba-ai
    restart: unless-stopped
    env_file:
      - .env
      - .env.local
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: https://escribaai.duckdns.org
      THREADS_REDIRECT_URI: https://escribaai.duckdns.org/api/integrations/threads/callback
      ENABLE_LOCAL_PUBLISHER: "true"
    ports:
      - "127.0.0.1:3100:3000"
    mem_limit: 768m
    cpus: 1.25
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

secrets:
  app_env:
    file: .env
  app_env_local:
    file: .env.local
